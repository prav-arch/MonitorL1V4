apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-model-init
  namespace: l1-monitoring
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
      - name: ollama-init
        image: ollama/ollama:latest
        command: 
        - "/bin/sh"
        - "-c"
        - "ollama serve > /dev/null 2>&1 & echo 'Waiting for Ollama to start...' && sleep 45 && echo 'Pulling tinyllama model...' && ollama pull tinyllama && echo 'Model successfully pulled'"
        resources:
          limits:
            memory: "768Mi"   # Further reduced for 8GB systems
            cpu: "600m"       # Further reduced for 8GB systems
          requests:
            memory: "384Mi"   # Further reduced for 8GB systems
            cpu: "100m"       # Further reduced for 8GB systems
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
      restartPolicy: Never
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-data-pvc