apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-model-init
  namespace: l1-monitoring
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
      - name: ollama-init
        image: ollama/ollama:latest
        command: 
        - "/bin/sh"
        - "-c"
        - "ollama serve > /dev/null 2>&1 & echo 'Waiting for Ollama to start...' && sleep 45 && echo 'Pulling smallest model...' && ollama pull orca-mini && echo 'Model successfully pulled'"
        resources:
          limits:
            memory: "512Mi"   # Extremely reduced for resource-constrained systems
            cpu: "300m"       # Extremely reduced for resource-constrained systems
          requests:
            memory: "256Mi"   # Extremely reduced for resource-constrained systems
            cpu: "80m"        # Extremely reduced for resource-constrained systems
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
      restartPolicy: Never
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-data-pvc